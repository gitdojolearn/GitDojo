name: Set up Playwright
description: >
  Restore a Playwright browser from the cache (downloading it when the cache misses) and install
  the system libraries it needs, with each attempt bounded so a stalled apt cannot run away with
  the job's whole timeout.
inputs:
  browser:
    description: The Playwright browser to install.
    required: false
    default: chromium
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install ${{ inputs.browser }} and its system libraries
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        CACHED: ${{ steps.browsers.outputs.cache-hit }}
        # The libraries come from apt: never wait for a debconf prompt or a service restart.
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: |
        set -euo pipefail
        # With the browser already cached, only its system libraries are missing.
        if [ "${CACHED:-}" = "true" ]; then
          set -- install-deps "$BROWSER"
        else
          set -- install --with-deps "$BROWSER"
        fi
        # Playwright's install-deps can take several minutes while apt downloads packages. A
        # short timeout can kill Playwright but leave apt running; retrying then collides with
        # that orphaned process's dpkg lock. Give one install a bounded 8-minute window instead.
        if timeout --kill-after=30s 480s pnpm --filter @gitdojo/web exec playwright "$@"; then
          exit 0
        fi
        echo "::error::playwright $1 did not finish within 8 minutes or failed"
        exit 1
