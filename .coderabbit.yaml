# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every pull request. CI already runs lint, typecheck, tests and the release
# note check, so reviews focus on what those can't catch: the project's rules and real bugs.
language: en-US
early_access: false

reviews:
  # Balanced feedback. `main` requires every review thread to be resolved before merging, so
  # nitpicks have a real cost.
  profile: chill
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  collapse_walkthrough: true
  # A code owner must approve; an app can't be one, so CodeRabbit's approval would not count.
  auto_approvals:
    enabled: false
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - dependabot[bot]

  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/*-snapshots/**"
    - "!**/*.{png,jpg,jpeg,webp,ico}"
    - "!**/next-env.d.ts"
    - "!.github/legacy-pr-release-notes.json"

  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: |
        - Only `packages/git-engine` may import isomorphic-git, and its types must not leak out
          of that package's public API (others see `GitCommandResult`, `GitRepositorySnapshot`
          and `RepositoryState`).
        - No `any`, `@ts-ignore` or silent `catch` blocks.
        - Comments should explain why, not what.
        - Tests live next to the code (`*.test.ts`); a bug fix needs a test for the failure case.
    - path: "packages/validator/**"
      instructions: |
        Validators inspect repository state, never command text: `git add README.md` and
        `git add .` must both satisfy "README.md is staged". Flag any check on the typed line.
    - path: "packages/{command-parser,git-engine,lesson-engine,challenge-engine}/**"
      instructions: |
        - All terminal input goes through the parser. Unsupported programs are rejected with
          `command not found`; nothing may reach the operating system.
        - Behaviour should match real Git. Check edge cases: empty repository, detached HEAD,
          conflicts, unborn branch.
        - Workspace paths go through `normalizeWorkspacePath`, which rejects `..`, backslashes
          and null bytes. Nothing may write into `.git` directly.
        - Progress follows state, not text: completion comes from validators, command counts from
          what the router actually ran.
    - path: "packages/error-engine/**"
      instructions: |
        Learner-facing errors are plain words in Git's style with an internal error code. Stack
        traces go to the developer console, never to the learner.
    - path: "content/**/*.yaml"
      instructions: |
        Lesson, challenge and practice content (see `docs/lesson-authoring.md`).
        - Objectives check repository state, so alternative valid commands also pass.
        - Hints climb concept → command → answer. A level 3 hint names the command in backticks.
          Challenges never give the answer away.
        - No objective may pass before the learner has typed anything.
        - Existing lesson IDs must not change: learners' saved progress depends on them.
        - Only teach commands the sandbox can run; planned commands are `concept` lessons that
          say so in a `note` callout.
        - Copy is plain language for beginners.
    - path: "apps/web/**/*.{tsx,css}"
      instructions: |
        UI rules from `docs/ui.md`:
        - Use the design tokens; no hard-coded colours. `--text-muted` is for text;
          `--text-faint` is for icons, markers and rules only.
        - Movement goes through the `animate-gd-*` utilities so reduced motion is respected.
        - State is carried by text or an icon as well as colour, controls are labelled and
          keyboard reachable, and changes a learner should notice are announced.
        - Lesson UI stays generic and data-driven: no lesson-specific conditionals or lesson
          copy in React.
        - Zustand stores live only in `features/*/state`; respect the feature layers in
          `apps/web/eslint.config.js`.
    - path: "apps/web/db/migrations/**"
      instructions: |
        Migrations must be additive and reversible. Flag anything that drops or rewrites data
        without a rollback plan in the PR description.
    - path: ".github/workflows/**"
      instructions: |
        Third-party actions are pinned to a full commit SHA with the version in a comment.
        Prefer least-privilege `permissions` and `persist-credentials: false`.

  pre_merge_checks:
    # The project documents behaviour in `docs/` and comments, not docstrings on every export.
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: |
        Conventional Commits, e.g. `feat(lessons): add rebase course` or
        `fix(git-engine): handle detached HEAD`.
    # The PR template and the `PR release note` CI job already cover the description.
    description:
      mode: "off"

  tools:
    # CI runs the project's own ESLint and Prettier setup.
    eslint:
      enabled: false
    biome:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "docs/architecture.md"
      - "docs/ui.md"
      - ".github/CONTRIBUTING.md"
