id: protect-secrets
slug: protect-secrets
title: Keep Secrets Out of Git History
type: concept

goal: Prevent credentials and private configuration from entering commits.
description: Ignoring a file helps before it is tracked; it does not erase a secret already committed.
difficulty: beginner
concepts: [gitignore, security, commits]

content:
  - type: text
    title: Prevent the first commit
    body: >-
      Put local configuration and generated files in `.gitignore` before staging them. Keep a
      checked-in example such as `.env.example` with placeholder values so teammates know which
      settings they need.

  - type: comparison
    title: Ignore rules do not remove tracked files
    columns:
      - title: Not tracked yet
        items:
          - Add a matching rule to `.gitignore`
          - Git stops listing the file as untracked
      - title: Already tracked or committed
        items:
          - Ignore rules do not remove it from the index or past commits
          - Remove tracking and handle the exposed credential

  - type: callout
    tone: warning
    body: >-
      Treat a committed password or API key as exposed. Revoke or rotate it first; rewriting history
      does not make a leaked credential safe again.
